name: Deploy Staging (Sandbox)

on:
  push:
    branches:
      - 'staging'

jobs:
  test:
    name: Worker Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # needed by check-cache-versions (git diff HEAD~1)

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci

      - name: Run worker tests
        run: npm test

      - name: Check cache version bumps
        run: cd .. && node scripts/check-cache-versions.js

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

  deploy-sandbox-worker:
    name: Deploy Staging Worker
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci

      # Deploy staging env (ENVIRONMENT=staging → gaslamar-worker-staging.carolineratuolivia.workers.dev)
      # Uses Mayar sandbox (api.mayar.club) and redirects back to staging.gaslamar.pages.dev after payment.
      - name: Deploy staging Cloudflare Worker
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Health check staging worker
        run: |
          sleep 8
          # Staging worker is deployed via custom route (workers_dev = false in wrangler.toml).
          # The *.workers.dev subdomain is disabled — use the canonical route instead.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api-staging.gaslamar.com/health)
          echo "Staging worker health: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: expected 200, got $STATUS"
            exit 1
          fi

      - name: CORS security header check (staging)
        run: |
          set -e
          ALLOWED_ORIGIN="https://staging.gaslamar.pages.dev"
          WORKER="https://api-staging.gaslamar.com"
          FAIL=0

          echo "--- [1] API: /health with allowlisted Origin must echo that origin (never *) ---"
          ACAO=$(curl -s -I -H "Origin: $ALLOWED_ORIGIN" "$WORKER/health" \
            | grep -i "^access-control-allow-origin:" | tr -d '\r' | awk '{print $2}')
          echo "  Access-Control-Allow-Origin: '$ACAO'"
          if [ "$ACAO" = "$ALLOWED_ORIGIN" ]; then
            echo "  PASS: origin echoed correctly"
          else
            echo "  FAIL: expected '$ALLOWED_ORIGIN', got '$ACAO'"
            FAIL=1
          fi

          echo "--- [2] API: /health with allowlisted Origin must include credentials header ---"
          ACAC=$(curl -s -I -H "Origin: $ALLOWED_ORIGIN" "$WORKER/health" \
            | grep -i "^access-control-allow-credentials:" | tr -d '\r' | awk '{print $2}')
          echo "  Access-Control-Allow-Credentials: '$ACAC'"
          if [ "$ACAC" = "true" ]; then
            echo "  PASS"
          else
            echo "  FAIL: expected 'true', got '$ACAC'"
            FAIL=1
          fi

          echo "--- [3] API: /health with unknown Origin must NOT return any ACAO header ---"
          ACAO_UNKNOWN=$(curl -s -I -H "Origin: https://evil.example.com" "$WORKER/health" \
            | grep -i "^access-control-allow-origin:" | tr -d '\r')
          if [ -z "$ACAO_UNKNOWN" ]; then
            echo "  PASS: no ACAO header for unknown origin"
          else
            echo "  FAIL: got ACAO header for unknown origin: '$ACAO_UNKNOWN'"
            FAIL=1
          fi

          echo "--- [4] API: /health must never return wildcard * ---"
          ACAO_ANY=$(curl -s -I -H "Origin: $ALLOWED_ORIGIN" "$WORKER/health" \
            | grep -i "^access-control-allow-origin:" | tr -d '\r' | awk '{print $2}')
          if [ "$ACAO_ANY" = "*" ]; then
            echo "  FAIL: wildcard * returned — this must never happen on authenticated endpoints"
            FAIL=1
          else
            echo "  PASS: no wildcard"
          fi

          echo "--- [5] API root path must have no ACAO header (non-API requests are not CORS-enabled) ---"
          ROOT_ACAO=$(curl -s -I -H "Origin: $ALLOWED_ORIGIN" "$WORKER/" \
            | grep -i "^access-control-allow-origin:" | tr -d '\r')
          if [ -z "$ROOT_ACAO" ]; then
            echo "  PASS: no ACAO on root path"
          else
            echo "  FAIL: root path returned ACAO '$ROOT_ACAO' — worker must not set CORS headers on non-API paths"
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "CORS security check FAILED — see above."
            exit 1
          fi
          echo ""
          echo "All CORS security checks passed."

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build vendor libs + JS bundles
        run: npm run build
        env:
          GASLAMAR_IS_SANDBOX: 'true'

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-staging
          path: |
            .
            !node_modules
            !worker/node_modules
            !.git
          retention-days: 1

  deploy-staging-pages:
    name: Deploy Staging to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build-frontend, deploy-sandbox-worker]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-staging
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Deploys as a preview branch → gets URL like https://staging.gaslamar.pages.dev
      - name: Deploy preview to Cloudflare Pages
        id: pages
        run: |
          npx wrangler@3 pages deploy dist \
            --project-name=gaslamar \
            --branch=staging \
            --commit-dirty=true \
            2>&1 | tee /tmp/pages-output.txt
          echo "--- Pages output ---"
          cat /tmp/pages-output.txt
          # Extract the preview URL from wrangler output; fall back to the canonical
          # branch alias so the smoke test always has a valid target.
          URL=$(grep -oE 'https://[a-z0-9-]+\.gaslamar\.pages\.dev' /tmp/pages-output.txt | head -1)
          if [ -z "$URL" ]; then
            URL="https://staging.gaslamar.pages.dev"
            echo "URL not found in wrangler output — using canonical alias: $URL"
          fi
          echo "staging_url=$URL" >> $GITHUB_OUTPUT
          echo "Staging URL: $URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Print staging URL
        run: |
          echo "========================================="
          echo "STAGING URL: ${{ steps.pages.outputs.staging_url }}"
          echo "Staging worker: https://gaslamar-worker-staging.carolineratuolivia.workers.dev"
          echo "========================================="

      # Verify the live staging page is serving bundles built from this commit,
      # not a stale deployment. Catches the bundle/source divergence that caused
      # QA false positive MEDIUM #1 (2026-06-01).
      - name: Verify staging bundle fingerprints match current build
        run: |
          sleep 20
          STAGING_URL="${{ steps.pages.outputs.staging_url }}" node dist/scripts/verify-staging-bundle.js

      # Structural smoke test: confirms each deployed page has the correct root
      # element, loads only its own React bundle, and returns HTTP 200.
      # This catches stale HTML (wrong bundle reference) and server errors.
      #
      # NOTE: hasil.html and download.html are session-protected pages. Cloudflare
      # Pages "Clean URLs" strips .html → redirects /hasil.html → /hasil, which
      # then hits the _redirects rule and sends unauthenticated users to upload.html.
      # We cannot check their HTML content without auth, so we verify their JS
      # bundle assets directly instead (same strategy as verify-staging-bundle.js).
      - name: Structural smoke test
        run: |
          set -e
          BASE="${{ steps.pages.outputs.staging_url }}"
          FAIL=0

          # check_page: fetch the HTML page (without following redirects) and
          # verify it contains the expected root element and bundle reference.
          check_page() {
            local FILE="$1"
            local OWN_BUNDLE="$2"
            local ROOT_ELEM="$3"
            local TITLE_FRAGMENT="$4"
            local URL="$BASE/$FILE"

            echo ""
            echo "=== $FILE ==="
            # Do NOT follow redirects (-L omitted): session-protected pages redirect
            # unauthenticated requests and we must not read the redirect destination.
            HTTP_STATUS=$(curl -s -o /tmp/smoke_body.html -w "%{http_code}" \
              -H "Cache-Control: no-cache" -H "Pragma: no-cache" "$URL")

            if [ "$HTTP_STATUS" != "200" ]; then
              echo "  FAIL: HTTP $HTTP_STATUS (expected 200)"
              FAIL=1
              return
            fi
            echo "  OK: HTTP 200"

            if ! grep -q "$ROOT_ELEM" /tmp/smoke_body.html; then
              echo "  FAIL: root element '$ROOT_ELEM' not found"
              FAIL=1
            else
              echo "  OK: root element '$ROOT_ELEM' present"
            fi

            if ! grep -q "$OWN_BUNDLE" /tmp/smoke_body.html; then
              echo "  FAIL: own bundle '$OWN_BUNDLE' not found"
              FAIL=1
            else
              echo "  OK: own bundle '$OWN_BUNDLE' loaded"
            fi

            if [ -n "$TITLE_FRAGMENT" ]; then
              if ! grep -q "$TITLE_FRAGMENT" /tmp/smoke_body.html; then
                echo "  FAIL: title fragment '$TITLE_FRAGMENT' not found"
                FAIL=1
              else
                echo "  OK: title fragment found"
              fi
            fi
          }

          # check_bundle_asset: for session-protected pages that always redirect
          # unauthenticated requests, verify the JS bundle file itself is deployed
          # and returns HTTP 200. The bundle content hash was already confirmed by
          # the "Verify staging bundle fingerprints" step above.
          check_bundle_asset() {
            local LABEL="$1"
            local BUNDLE_PATH="$2"
            local URL="$BASE/$BUNDLE_PATH"

            echo ""
            echo "=== $LABEL (bundle asset check) ==="
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Cache-Control: no-cache" -H "Pragma: no-cache" "$URL")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "  OK: HTTP 200 — bundle deployed"
            else
              echo "  FAIL: HTTP $HTTP_STATUS (expected 200) — bundle missing or not served"
              FAIL=1
            fi
          }

          # Public pages: check HTML content directly.
          check_page "upload.html"    "upload-react.bundle.js"    "upload-root"    ""
          check_page "analyzing.html" "analyzing-react.bundle.js" "analyzing-root" ""

          # Session-protected pages redirect unauthenticated requests via Clean URLs
          # + _redirects. Verify their JS bundles are deployed instead.
          check_bundle_asset "hasil.html"    "js/dist/hasil-react.bundle.js"
          check_bundle_asset "download.html" "js/dist/download-react.bundle.js"

          echo ""
          if [ "$FAIL" -ne 0 ]; then
            echo "Structural smoke test FAILED — see above."
            exit 1
          fi
          echo "All structural smoke checks passed."
