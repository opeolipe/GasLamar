name: Deploy Staging (Sandbox)

on:
  push:
    branches:
      - 'staging'

jobs:
  test:
    name: Worker Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # needed by check-cache-versions (git diff HEAD~1)

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci

      - name: Run worker tests
        run: npm test

      - name: Check cache version bumps
        run: cd .. && node scripts/check-cache-versions.js

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

  deploy-sandbox-worker:
    name: Deploy Staging Worker
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci

      # Deploy staging env (ENVIRONMENT=staging → gaslamar-worker-staging.carolineratuolivia.workers.dev)
      # Uses Mayar sandbox (api.mayar.club) and redirects back to staging.gaslamar.pages.dev after payment.
      - name: Deploy staging Cloudflare Worker
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Health check staging worker
        run: |
          sleep 8
          # Staging worker is deployed via custom route (workers_dev = false in wrangler.toml).
          # The *.workers.dev subdomain is disabled — use the canonical route instead.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api-staging.gaslamar.com/health)
          echo "Staging worker health: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: expected 200, got $STATUS"
            exit 1
          fi

      - name: CORS security header check (staging)
        run: |
          set -e
          ALLOWED_ORIGIN="https://staging.gaslamar.pages.dev"
          WORKER="https://api-staging.gaslamar.com"
          FAIL=0

          echo "--- [1] API: /health with allowlisted Origin must echo that origin (never *) ---"
          ACAO=$(curl -s -I -H "Origin: $ALLOWED_ORIGIN" "$WORKER/health" \
            | grep -i "^access-control-allow-origin:" | tr -d '\r' | awk '{print $2}')
          echo "  Access-Control-Allow-Origin: '$ACAO'"
          if [ "$ACAO" = "$ALLOWED_ORIGIN" ]; then
            echo "  PASS: origin echoed correctly"
          else
            echo "  FAIL: expected '$ALLOWED_ORIGIN', got '$ACAO'"
            FAIL=1
          fi

          echo "--- [2] API: /health with allowlisted Origin must include credentials header ---"
          ACAC=$(curl -s -I -H "Origin: $ALLOWED_ORIGIN" "$WORKER/health" \
            | grep -i "^access-control-allow-credentials:" | tr -d '\r' | awk '{print $2}')
          echo "  Access-Control-Allow-Credentials: '$ACAC'"
          if [ "$ACAC" = "true" ]; then
            echo "  PASS"
          else
            echo "  FAIL: expected 'true', got '$ACAC'"
            FAIL=1
          fi

          echo "--- [3] API: /health with unknown Origin must NOT return any ACAO header ---"
          ACAO_UNKNOWN=$(curl -s -I -H "Origin: https://evil.example.com" "$WORKER/health" \
            | grep -i "^access-control-allow-origin:" | tr -d '\r')
          if [ -z "$ACAO_UNKNOWN" ]; then
            echo "  PASS: no ACAO header for unknown origin"
          else
            echo "  FAIL: got ACAO header for unknown origin: '$ACAO_UNKNOWN'"
            FAIL=1
          fi

          echo "--- [4] API: /health must never return wildcard * ---"
          ACAO_ANY=$(curl -s -I -H "Origin: $ALLOWED_ORIGIN" "$WORKER/health" \
            | grep -i "^access-control-allow-origin:" | tr -d '\r' | awk '{print $2}')
          if [ "$ACAO_ANY" = "*" ]; then
            echo "  FAIL: wildcard * returned — this must never happen on authenticated endpoints"
            FAIL=1
          else
            echo "  PASS: no wildcard"
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "CORS security check FAILED — see above."
            exit 1
          fi
          echo ""
          echo "All CORS security checks passed."

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build vendor libs + JS bundles
        run: npm run build
        env:
          GASLAMAR_IS_SANDBOX: 'true'

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-staging
          path: |
            .
            !node_modules
            !worker/node_modules
            !.git
          retention-days: 1

  deploy-staging-pages:
    name: Deploy Staging to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-staging
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Deploys as a preview branch → gets URL like https://staging.gaslamar.pages.dev
      - name: Deploy preview to Cloudflare Pages
        id: pages
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name=gaslamar \
            --branch=staging \
            --commit-dirty=true \
            2>&1 | tee /tmp/pages-output.txt
          echo "--- Pages output ---"
          cat /tmp/pages-output.txt
          # Extract the preview URL from wrangler output
          URL=$(grep -oE 'https://[a-z0-9-]+\.gaslamar\.pages\.dev' /tmp/pages-output.txt | head -1)
          echo "staging_url=$URL" >> $GITHUB_OUTPUT
          echo "Staging URL: $URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Print staging URL
        run: |
          echo "========================================="
          echo "STAGING URL: ${{ steps.pages.outputs.staging_url }}"
          echo "Staging worker: https://gaslamar-worker-staging.carolineratuolivia.workers.dev"
          echo "========================================="
